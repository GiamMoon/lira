org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# El proyecto vive en D: y el caché de paquetes de Dart en C:. La compilación
# incremental de Kotlin guarda rutas relativas al proyecto y no existe ruta
# relativa entre dos unidades de Windows, así que revienta al cerrar sus
# cachés ("Could not close incremental caches ... different roots").
# Desactivarla evita el problema; el coste es compilar los plugins enteros.
# Alternativa de fondo: mover el caché con PUB_CACHE a la misma unidad.
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
